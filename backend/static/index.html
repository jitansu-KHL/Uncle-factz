<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uncle-Factz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    * { font-family: 'Inter', system-ui, sans-serif; }
    body { background: #09090b; color: #fafafa; }
    .line-clamp-3 {
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const SAMPLES = [
      "Vaccines cause autism.",
      "Humans only use 10% of their brain.",
      "The Great Wall of China is visible from space.",
    ];

    // Shared helpers
    const icon = (n) => n.includes("Science") ? "🔬" : n.includes("Health") ? "🩺" : n.includes("Politics") ? "🏛️" : "👤";

    const VERDICT = {
      "True":       { label: "Verified True",     color: "text-emerald-400 bg-emerald-400/10 border-emerald-400/30", accent: "border-emerald-500/40", short: "TRUE",  text: "text-emerald-300" },
      "Mostly True":{ label: "Mostly True",       color: "text-sky-400 bg-sky-400/10 border-sky-400/30",         accent: "border-sky-500/40",     short: "MOSTLY TRUE", text: "text-sky-300" },
      "False":      { label: "False",             color: "text-red-400 bg-red-400/10 border-red-400/30",         accent: "border-red-500/40",     short: "FALSE", text: "text-red-300" },
      "Contested":  { label: "Contested",         color: "text-amber-400 bg-amber-400/10 border-amber-400/30",     accent: "border-amber-500/40",   short: "CONTESTED", text: "text-amber-300" },
      "Uncertain":  { label: "Insufficient Evidence", color: "text-zinc-400 bg-zinc-400/10 border-zinc-400/30",   accent: "",                      short: "UNCERTAIN", text: "text-zinc-300" },
    };
    const getV = (v, contested) => VERDICT[contested ? "Contested" : (v in VERDICT ? v : "Uncertain")];

    const CHALLENGE = {
      "NO_SIGNIFICANT_CHALLENGE": { label: "No Challenge",   color: "text-emerald-400 bg-emerald-400/10 border-emerald-400/30", icon: "✅" },
      "WEAK_CHALLENGE":           { label: "Weak Challenge", color: "text-sky-400 bg-sky-400/10 border-sky-400/30",             icon: "🔵" },
      "STRONG_CHALLENGE":         { label: "Strong Challenge", color: "text-amber-400 bg-amber-400/10 border-amber-400/30",     icon: "🟠" },
      "VERDICT_INVALIDATED":      { label: "Verdict Overruled", color: "text-red-400 bg-red-400/10 border-red-400/30",           icon: "🔴" },
    };

    function App() {
      const [claim, setClaim] = useState("");
      const [loading, setLoading] = useState(false);
      const [step, setStep] = useState(0);
      const [result, setResult] = useState(null);
      const [error, setError] = useState(null);
      const [history, setHistory] = useState([]);
      const [tab, setTab] = useState("check");
      const [proofOpen, setProofOpen] = useState(false);
      const [expanded, setExpanded] = useState({});
      // { "Science Agent": { loading, data, error } }
      const [grandpa, setGrandpa] = useState({});

      useEffect(() => {
        fetch("/api/history").then(r => r.ok ? r.json() : []).then(setHistory).catch(() => {});
      }, []);

      const askGrandpa = async (agent) => {
        const key = agent.agent_name;
        setGrandpa(prev => ({ ...prev, [key]: { loading: true, data: null, error: null } }));
        try {
          const res = await fetch("/api/challenge-agent", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              claim: result.claim,
              agent_name: key,
              agent_verdict: agent.verdict,
              agent_confidence: agent.confidence,
              agent_reasoning: agent.reasoning,
            }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Grandpa couldn't finish.");
          setGrandpa(prev => ({ ...prev, [key]: { loading: false, data, error: null } }));
        } catch (e) {
          setGrandpa(prev => ({ ...prev, [key]: { loading: false, data: null, error: e.message } }));
        }
      };

      const check = async (text) => {
        const q = (text || claim).trim();
        if (!q) return;
        setLoading(true); setError(null); setResult(null); setTab("check");
        setExpanded({}); setGrandpa({});
        setStep(1);
        const timers = [1000, 2200, 3400].map((d, i) => setTimeout(() => setStep(i + 2), d));
        try {
          const res = await fetch("/api/factcheck", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ claim: q }) });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Analysis failed");
          setResult(data);
          fetch("/api/history").then(r => r.ok ? r.json() : []).then(setHistory).catch(() => {});
        } catch (e) { setError(e.message); }
        finally { timers.forEach(clearTimeout); setLoading(false); setStep(0); }
      };

      // ──────────────────────── HERO / SEARCH ────────────────────────
      const heroView = (
        <div className="flex flex-col items-center justify-center min-h-[60vh] px-4">
          <div className="mb-8 text-center">
            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-zinc-800/80 border border-zinc-700/60 text-[11px] text-zinc-400 mb-6">
              <span className="h-1.5 w-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
              4 AI Uncles · Evidence-Grounded · Grandpa Double-Checks
            </div>
            <h1 className="text-4xl sm:text-5xl font-extrabold tracking-tight text-white mb-3">Uncle-Factz</h1>
            <p className="text-zinc-400 text-sm max-w-md mx-auto">
              Paste any claim. The uncles search the web and debate it independently. Grandpa can double-check each uncle's verdict.
            </p>
          </div>

          <form onSubmit={e => { e.preventDefault(); check(); }} className="w-full max-w-2xl space-y-3">
            <textarea
              rows="2"
              value={claim}
              onChange={e => setClaim(e.target.value)}
              placeholder="Enter a claim the uncles should fact-check..."
              className="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-5 py-4 text-[15px] text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/60 focus:border-transparent resize-none"
            />
            <div className="flex items-center justify-between flex-wrap gap-3">
              <div className="flex gap-1.5 flex-wrap">
                {SAMPLES.map((s, i) => (
                  <button key={i} type="button" onClick={() => { setClaim(s); check(s); }}
                    className="text-[11px] px-2.5 py-1 rounded-md bg-zinc-800/70 hover:bg-zinc-700/70 text-zinc-400 hover:text-zinc-200 border border-zinc-700/40 transition truncate max-w-[180px]"
                    title={s}>{s}</button>
                ))}
              </div>
              <button type="submit" disabled={loading || !claim.trim()}
                className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 text-white text-sm font-semibold transition">
                {loading ? "Uncles are thinking..." : "Verify Claim →"}
              </button>
            </div>
          </form>
        </div>
      );

      // ──────────────────────── LOADING ────────────────────────
      const loadingView = (
        <div className="max-w-2xl mx-auto mt-8 p-6 rounded-xl bg-zinc-900/60 border border-zinc-800 text-center space-y-4">
          <div className="flex items-center justify-center gap-2 text-sm text-indigo-300 font-medium">
            <span className="h-2 w-2 rounded-full bg-indigo-500 animate-ping"></span>
            The 4 AI uncles are debating the claim...
          </div>
          <div className="grid grid-cols-4 gap-2 text-[11px] font-medium">
            {["🌐 Web Search", "🤖 4 Uncles", "⚖️ Consensus", "⛓️ Proof"].map((s, i) => (
              <div key={i} className={`py-2 rounded-lg border transition-all duration-300 ${step > i ? 'bg-indigo-950/60 border-indigo-500/50 text-indigo-200' : 'bg-zinc-950/40 border-zinc-800 text-zinc-600'}`}>{s}</div>
            ))}
          </div>
        </div>
      );

      // ──────────────────────── GRANDPA CARD (inside expanded uncle) ────────────────────────
      function GrandpaPanel({ agent }) {
        const g = grandpa[agent.agent_name];
        if (!g) return (
          <button onClick={() => askGrandpa(agent)}
                  className="mt-2 w-full py-2 rounded-lg bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/30 text-[11px] font-semibold transition flex items-center justify-center gap-1.5">
            👴 Ask Grandpa to double-check this uncle
          </button>
        );
        if (g.loading) return (
          <div className="mt-2 p-3 rounded-lg bg-zinc-950/60 border border-zinc-700/50 text-center">
            <div className="flex items-center justify-center gap-2 text-[11px] text-amber-300">
              <span className="h-1.5 w-1.5 rounded-full bg-amber-400 animate-ping"></span>
              👴 Grandpa is fact-checking this uncle's work...
            </div>
          </div>
        );
        if (g.error) return (
          <div className="mt-2 p-3 rounded-lg bg-red-950/30 border border-red-500/30 text-[11px] text-red-300">
            Grandpa couldn't finish: {g.error}
            <button onClick={() => askGrandpa(agent)} className="ml-2 underline">Ask again</button>
          </div>
        );
        const d = g.data;
        const cb = CHALLENGE[d.challenge_status] || CHALLENGE["NO_SIGNIFICANT_CHALLENGE"];
        return (
          <div className="mt-2 p-3 rounded-lg bg-amber-950/20 border border-amber-500/20 space-y-2.5">
            <div className="flex items-center justify-between">
              <span className="text-[11px] font-bold text-amber-300 flex items-center gap-1.5">
                👴 Grandpa's Review
              </span>
              <span className={`text-[10px] font-bold px-2 py-0.5 rounded border ${cb.color}`}>
                {cb.icon} {cb.label}
              </span>
            </div>
            <div className="flex items-center gap-3 text-[10px] text-zinc-500">
              <span>📚 {d.sources_analyzed || 0} sources read</span>
              {d.contradictory_sources_found > 0 && (
                <span className="text-amber-400">⚠ {d.contradictory_sources_found} contradict this uncle</span>
              )}
            </div>
            <p className="text-[11px] text-zinc-400 leading-relaxed italic">"{d.explanation}"</p>

            {d.contradicting_evidence?.length > 0 && (
              <div className="space-y-1">
                <span className="text-[10px] font-semibold text-amber-400 uppercase tracking-wider">👴 Grandpa found holes here</span>
                {d.contradicting_evidence.map((e, j) => (
                  <p key={j} className="text-[11px] text-zinc-400 pl-2 border-l-2 border-amber-500/40">⚠ {e}</p>
                ))}
              </div>
            )}

            {d.supporting_original?.length > 0 && (
              <div className="space-y-1">
                <span className="text-[10px] font-semibold text-emerald-400 uppercase tracking-wider">👴 Grandpa says the uncle was right</span>
                {d.supporting_original.map((e, j) => (
                  <p key={j} className="text-[11px] text-zinc-400 pl-2 border-l-2 border-emerald-500/40">✓ {e}</p>
                ))}
              </div>
            )}

            {d.challenge_sources?.length > 0 && (
              <div className="space-y-1 pt-1 border-t border-zinc-800/60">
                <span className="text-[10px] font-semibold text-zinc-500 uppercase tracking-wider">Grandpa's sources</span>
                {d.challenge_sources.map((s, j) => (
                  <a key={j} href={s.url} target="_blank" rel="noreferrer" className="block text-[10px] text-indigo-400 hover:underline truncate">
                    [{j+1}] {s.title} ↗
                  </a>
                ))}
              </div>
            )}

            {d.suggested_verdict !== d.original_verdict && (
              <div className="pt-1.5 border-t border-zinc-800/60 flex items-center gap-2 text-[11px]">
                <span className="text-zinc-500">Grandpa suggests:</span>
                <span className={`font-bold px-1.5 py-0.5 rounded border ${getV(d.suggested_verdict,false).color}`}>
                  {d.suggested_verdict} ({Math.round(d.suggested_confidence * 100)}%)
                </span>
              </div>
            )}
          </div>
        );
      }

      // ──────────────────────── RESULTS ────────────────────────
      const resultsView = result && (() => {
        const b = getV(result.final_verdict, result.is_contested);
        const agents = result.agents || [];
        const agreeCount = agents.filter(a =>
          a.verdict === result.final_verdict || (a.verdict === "True" && result.final_verdict === "Mostly True")
        ).length;
        const totalScore = agents.reduce((acc, a) => acc + (a.confidence || 0), 0);

        return (
          <div className="max-w-4xl mx-auto mt-6 space-y-5 px-4 pb-12">
            {/* Back bar */}
            <div className="flex items-center justify-between">
              <button onClick={() => { setResult(null); setClaim(""); setGrandpa({}); setExpanded({}); }}
                      className="text-xs text-zinc-400 hover:text-white transition">← New check</button>
              <div className="flex gap-2">
                <button onClick={() => setProofOpen(true)}
                        className="text-[11px] px-3 py-1 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/60 transition">⛓️ Proof Details</button>
                <button onClick={() => setTab("history")}
                        className="text-[11px] px-3 py-1 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/60 transition">📜 History</button>
              </div>
            </div>

            {/* Claim + Verdict Card (big pill style from your photo, dark) */}
            <div className={`rounded-xl border p-6 bg-zinc-900/80 ${b.accent} space-y-4`}>
              <p className="text-[13px] text-zinc-300 leading-relaxed">"{result.claim}"</p>

              <div className="flex flex-col md:flex-row md:items-center gap-4">
                <div className={`flex items-center gap-3 px-4 py-3 rounded-xl border ${b.color} flex-1`}>
                  <div className={`h-9 w-9 rounded-full bg-zinc-950/60 border flex items-center justify-center ${b.color.split(" ")[2]}`}>
                    <span className="text-base font-black">{b.short.charAt(0) === "F" ? "✕" : b.short.charAt(0) === "T" ? "✓" : "⚠"}</span>
                  </div>
                  <div className={`text-xl font-black tracking-tight ${b.text}`}>{b.short}</div>
                </div>
                <div className="md:w-56 space-y-1.5">
                  <div className="flex items-end justify-between">
                    <span className="text-[11px] text-zinc-400 font-medium">Confidence</span>
                    <span className="text-lg font-bold text-white">{Math.round(result.overall_confidence * 100)}%</span>
                  </div>
                  <div className="w-full bg-zinc-800 rounded-full h-2">
                    <div className="h-2 rounded-full bg-indigo-500" style={{width:`${Math.round(result.overall_confidence*100)}%`}}></div>
                  </div>
                </div>
              </div>

              <div className="flex flex-wrap items-center justify-between gap-3 pt-1">
                <p className="text-xs font-semibold text-zinc-200">
                  {agreeCount} out of {agents.length} uncles say this is{" "}
                  <span className={b.text}>{result.final_verdict.toLowerCase()}</span>.
                </p>
                <p className="text-[11px] text-zinc-400">
                  Total Score: <span className="text-zinc-200 font-bold">{totalScore.toFixed(2)}</span> / {agents.length.toFixed(2)}
                </p>
              </div>

              <p className="text-[11px] text-zinc-400 leading-relaxed pt-2 border-t border-zinc-800/60">{result.consensus_summary}</p>
            </div>

            {/* Checklist */}
            <div className="rounded-xl border border-zinc-800 p-5 bg-zinc-900/60 space-y-3">
              <div className="flex items-center justify-between">
                <h3 className="text-sm font-semibold text-zinc-200">✅ Uncle Verification Checklist</h3>
                <span className="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/10 text-emerald-300 border border-emerald-500/30">
                  All uncles completed
                </span>
              </div>
              <div className="w-full h-px bg-zinc-800"></div>
              <div className="space-y-2">
                {agents.map((a, i) => {
                  const ab = getV(a.verdict, false);
                  return (
                    <div key={i} className="flex items-center justify-between gap-3">
                      <div className="flex items-center gap-2.5">
                        <span>{icon(a.agent_name)}</span>
                        <span className="text-[13px] font-medium text-zinc-200">{a.agent_name}</span>
                        <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded border ${ab.color}`}>{a.verdict}</span>
                      </div>
                      <div className="flex items-center gap-1.5">
                        <div className="h-5 w-5 rounded-full bg-emerald-500 flex items-center justify-center">
                          <span className="text-white text-[10px] font-black">✓</span>
                        </div>
                        <span className="text-[11px] font-semibold text-emerald-300">Completed</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Uncles Grid */}
            <div>
              <h3 className="text-sm font-semibold text-zinc-300 mb-3">🗣️ What the Uncles Say</h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                {agents.map((a, i) => {
                  const ab = getV(a.verdict, false);
                  const isOpen = expanded[i];
                  return (
                    <div key={i} className="rounded-xl bg-zinc-900/60 border border-zinc-800/80 p-4 space-y-2.5">
                      <div className="flex items-center justify-between">
                        <span className="text-sm font-semibold text-white flex items-center gap-2">
                          {icon(a.agent_name)} {a.agent_name}
                        </span>
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded border ${ab.color}`}>{a.verdict}</span>
                      </div>

                      {isOpen && a.model_id && (
                        <p className="text-[10px] text-indigo-300/80">
                          {String(a.model_id).startsWith("specialist-") ? "Trained specialist uncle" : "Shared LLM uncle"} · {a.model_id}
                        </p>
                      )}

                      <p className={`text-[12px] text-zinc-400 leading-relaxed ${!isOpen ? "line-clamp-3" : ""}`}>{a.reasoning}</p>

                      {isOpen && a.persona && (
                        <div className="bg-zinc-950/40 p-2.5 rounded-lg border border-zinc-800/60">
                          <div className="text-[9px] uppercase text-zinc-500 font-semibold mb-0.5">Uncle Persona</div>
                          <p className="text-[11px] text-zinc-400 leading-relaxed">{a.persona}</p>
                        </div>
                      )}

                      {isOpen && <GrandpaPanel agent={a} />}

                      <button onClick={() => setExpanded(x => ({ ...x, [i]: !x[i] }))}
                              className="text-[11px] text-indigo-400 hover:text-indigo-300 font-semibold flex items-center gap-1.5 transition">
                        {isOpen ? <>Read less <span>⌃</span></> : <>Read more <span>⌄</span></>}
                      </button>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Bottom line */}
            <div className="rounded-xl bg-indigo-950/30 border border-indigo-500/30 p-4 flex items-start gap-3">
              <div className="h-8 w-8 rounded-full bg-zinc-950/60 border border-indigo-400/40 flex items-center justify-center flex-shrink-0">
                <span className="text-indigo-300 font-black">ⓘ</span>
              </div>
              <div className="flex-1">
                <span className="text-[13px] font-bold text-zinc-100">Bottom Line:&nbsp;&nbsp;</span>
                <span className="text-[13px] text-indigo-200 leading-relaxed">{result.consensus_summary}</span>
              </div>
            </div>

            {/* Sources */}
            {result.sources && result.sources.length > 0 && (
              <div>
                <h3 className="text-sm font-semibold text-zinc-300 mb-3">Sources ({result.sources.length})</h3>
                <div className="space-y-2">
                  {result.sources.map((s, i) => (
                    <div key={i} className="p-3 rounded-lg bg-zinc-900/60 border border-zinc-800/60">
                      <a href={s.url} target="_blank" rel="noreferrer" className="text-xs font-medium text-indigo-400 hover:underline">[{i+1}] {s.title} ↗</a>
                      <p className="text-[11px] text-zinc-500 mt-1 leading-relaxed">{s.snippet}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        );
      })();

      // ──────────────────────── HISTORY ────────────────────────
      const historyView = (
        <div className="max-w-3xl mx-auto mt-6 space-y-4 px-4 pb-12">
          <div className="flex items-center justify-between">
            <h2 className="text-lg font-bold text-white">Uncle Fact-Check Ledger</h2>
            <button onClick={() => setTab("check")} className="text-xs text-zinc-400 hover:text-white">← Back</button>
          </div>
          {history.length === 0 ? (
            <p className="text-sm text-zinc-500 text-center py-12">No claims checked yet.</p>
          ) : history.map(item => {
            const hb = getV(item.final_verdict, item.is_contested);
            return (
              <div key={item.id} className="p-4 rounded-xl bg-zinc-900/60 border border-zinc-800/60 space-y-2">
                <div className="flex items-center justify-between">
                  <span className="text-[11px] text-zinc-500">{new Date(item.timestamp).toLocaleString()}</span>
                  <span className={`text-[10px] font-bold px-2 py-0.5 rounded border ${hb.color}`}>{item.final_verdict}</span>
                </div>
                <p className="text-sm font-medium text-white">{item.claim}</p>
                <p className="text-[11px] text-zinc-400">{item.consensus_summary}</p>
                <div className="flex items-center justify-between pt-1 text-[11px] text-zinc-500">
                  <code>{item.blockchain_tx ? item.blockchain_tx.slice(0, 18) + "..." : "—"}</code>
                  <button onClick={() => { setResult(item); setTab("check"); setGrandpa({}); setExpanded({}); }}
                          className="text-indigo-400 hover:text-indigo-300 font-medium">View →</button>
                </div>
              </div>
            );
          })}
        </div>
      );

      // ──────────────────────── PROOF MODAL ────────────────────────
      const proofModal = proofOpen && result && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4" onClick={() => setProofOpen(false)}>
          <div className="bg-zinc-950 border border-zinc-800 rounded-2xl max-w-lg w-full p-6 space-y-5" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between">
              <h3 className="text-base font-bold text-white flex items-center gap-2">⛓️ Cryptographic Proof</h3>
              <button onClick={() => setProofOpen(false)} className="text-zinc-500 hover:text-white text-lg">✕</button>
            </div>

            <div className="space-y-3 text-xs">
              <div>
                <span className="text-zinc-500 uppercase text-[10px] font-semibold tracking-wider">Proof Hash</span>
                <div className="mt-1 p-2.5 rounded-lg bg-zinc-900 border border-zinc-800 font-mono text-indigo-300 break-all select-all text-[11px]">
                  {result.blockchain_tx || "—"}
                </div>
              </div>
              <div>
                <span className="text-zinc-500 uppercase text-[10px] font-semibold tracking-wider">Claim Hash (Keccak-256)</span>
                <div className="mt-1 p-2.5 rounded-lg bg-zinc-900 border border-zinc-800 font-mono text-zinc-300 break-all select-all text-[11px]">
                  {result.claim_hash || "—"}
                </div>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <span className="text-zinc-500 uppercase text-[10px] font-semibold tracking-wider">Verdict</span>
                  <div className="mt-1 p-2.5 rounded-lg bg-zinc-900 border border-zinc-800 font-semibold text-white">
                    {result.final_verdict} ({Math.round(result.overall_confidence * 100)}%)
                  </div>
                </div>
                <div>
                  <span className="text-zinc-500 uppercase text-[10px] font-semibold tracking-wider">Timestamp</span>
                  <div className="mt-1 p-2.5 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-300">
                    {new Date(result.timestamp).toUTCString()}
                  </div>
                </div>
              </div>

              <div className="p-3 rounded-lg bg-zinc-900/80 border border-zinc-800 text-zinc-500 text-[11px] leading-relaxed">
                <span className="font-semibold text-zinc-400">💡</span> Proof is computed via <code className="text-indigo-400">keccak256(claim + verdict + confidence + evidence)</code>.
                To broadcast live to Sepolia, deploy <code className="text-indigo-400">FactCheckRegistry.sol</code> and set
                <code className="text-indigo-400"> WEB3_RPC_URL</code> + <code className="text-indigo-400">PRIVATE_KEY</code> in <code className="text-indigo-400">.env</code>.
              </div>
            </div>

            <div className="flex justify-end gap-2">
              <a href={`https://sepolia.etherscan.io/tx/${result.blockchain_tx}`} target="_blank" rel="noreferrer"
                 className="px-3.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold transition disabled:opacity-40"
                 style={{ opacity: result.blockchain_tx ? 1 : 0.4, pointerEvents: result.blockchain_tx ? "auto" : "none" }}>
                Etherscan ↗
              </a>
              <button onClick={() => setProofOpen(false)}
                      className="px-3.5 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-semibold transition">Close</button>
            </div>
          </div>
        </div>
      );

      // ──────────────────────── ABOUT ────────────────────────
      const aboutView = (
        <div className="max-w-3xl mx-auto mt-8 px-4 space-y-8 pb-12">
          <div>
            <h2 className="text-2xl font-extrabold text-white mb-2">About Uncle-Factz</h2>
            <p className="text-sm text-zinc-400 leading-relaxed">
              A decentralized, AI-powered fact-checking crew: four specialized AI <b>uncles</b> analyze every claim in parallel, reach a consensus,
              and 👴 <b>Grandpa</b> can double-check each uncle's work to avoid groupthink. Results come with cryptographic proof.
            </p>
          </div>

          <div className="space-y-2">
            <h3 className="text-sm font-bold text-white flex items-center gap-2">🎯 The Problem</h3>
            <p className="text-[13px] text-zinc-400 leading-relaxed">
              When a claim appears online — like "This new policy will reduce prices by 50%" — there's no fast, trustworthy way to verify it.
              Traditional fact-checking can take days. Misinformation spreads in minutes.
            </p>
          </div>

          <div className="space-y-2">
            <h3 className="text-sm font-bold text-white flex items-center gap-2">💡 Our Solution</h3>
            <p className="text-[13px] text-zinc-400 leading-relaxed">
              Uncle-Factz replaces the slow, centralized model with a family of AI: four uncle-agents independently analyze claims,
              reach a confidence-weighted consensus, and then Grandpa can independently challenge each verdict — all in under 10 seconds.
            </p>
          </div>

          <div className="space-y-4">
            <h3 className="text-sm font-bold text-white flex items-center gap-2">⚙️ How It Works</h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              {[
                { step: "1", icon: "🌐", title: "Evidence Retrieval", desc: "The system searches the live web using DuckDuckGo and Wikipedia to gather 3–5 relevant, real-world sources for the claim." },
                { step: "2", icon: "👥", title: "4 AI Uncles Analyze", desc: "Four uncles — Science 🔬, Health 🩺, Politics 🏛️, and General 👤 — each independently evaluate the claim using the retrieved evidence." },
                { step: "3", icon: "⚖️", title: "Uncle Consensus Engine", desc: "A confidence-weighted voting algorithm aggregates all four verdicts, detects conflicts, and produces a final verdict with an overall confidence score." },
                { step: "4", icon: "👴", title: "Grandpa Double-Checks", desc: "Tap 'Ask Grandpa to double-check' inside any uncle's expanded card — Grandpa independently searches for contradictory evidence and challenges each verdict, preventing groupthink." },
                { step: "5", icon: "⛓️", title: "On-Chain Proof", desc: "The claim, verdict, confidence, and evidence are hashed with Ethereum's keccak256 algorithm, creating a tamper-evident cryptographic proof." },
              ].map((s, i) => (
                <div key={i} className="p-4 rounded-xl bg-zinc-900/60 border border-zinc-800/60 space-y-2">
                  <div className="flex items-center gap-2">
                    <span className="text-lg">{s.icon}</span>
                    <span className="text-xs font-bold text-white">Step {s.step}: {s.title}</span>
                  </div>
                  <p className="text-[12px] text-zinc-400 leading-relaxed">{s.desc}</p>
                </div>
              ))}
            </div>
          </div>

          <div className="space-y-3">
            <h3 className="text-sm font-bold text-white flex items-center gap-2">🛠️ Tech Stack</h3>
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
              {[
                { name: "FastAPI", desc: "Python backend" },
                { name: "React 18", desc: "Frontend UI" },
                { name: "Groq / OpenAI", desc: "Uncle brains" },
                { name: "DuckDuckGo + Wikipedia", desc: "Evidence search" },
                { name: "Solidity", desc: "Smart contract" },
                { name: "Web3.py + Keccak-256", desc: "Crypto proofs" },
                { name: "SQLite", desc: "Local ledger" },
                { name: "Tailwind CSS", desc: "Styling" },
                { name: "Ethereum Sepolia", desc: "Testnet chain" },
              ].map((t, i) => (
                <div key={i} className="p-3 rounded-lg bg-zinc-900/50 border border-zinc-800/50">
                  <p className="text-xs font-semibold text-white">{t.name}</p>
                  <p className="text-[11px] text-zinc-500">{t.desc}</p>
                </div>
              ))}
            </div>
          </div>

          <div className="space-y-3">
            <h3 className="text-sm font-bold text-white flex items-center gap-2">🏷️ Verdict Types</h3>
            <div className="space-y-2">
              {[
                { label: "Verified True",  color: "text-emerald-400 bg-emerald-400/10 border-emerald-400/30", desc: "Strong consensus — all uncles agree the evidence supports the claim." },
                { label: "Mostly True",    color: "text-sky-400 bg-sky-400/10 border-sky-400/30",         desc: "The claim is largely accurate but may have minor caveats." },
                { label: "False",          color: "text-red-400 bg-red-400/10 border-red-400/30",         desc: "Strong consensus — uncles agree the claim contradicts available evidence." },
                { label: "Contested",      color: "text-amber-400 bg-amber-400/10 border-amber-400/30",   desc: "Uncles disagree — domain-specific verdicts conflict with each other. Ask Grandpa!" },
                { label: "Insufficient Evidence", color: "text-zinc-400 bg-zinc-400/10 border-zinc-400/30",desc: "Not enough reliable sources found to make a determination." },
              ].map((v, i) => (
                <div key={i} className="flex items-start gap-3 p-3 rounded-lg bg-zinc-900/40 border border-zinc-800/40">
                  <span className={`text-[11px] font-bold px-2 py-0.5 rounded border whitespace-nowrap ${v.color}`}>{v.label}</span>
                  <p className="text-[12px] text-zinc-400">{v.desc}</p>
                </div>
              ))}
            </div>
          </div>

          <div className="pt-4 text-center">
            <button onClick={() => setTab("check")}
                    className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold transition">
              Try It Now →
            </button>
          </div>
        </div>
      );

      // ──────────────────────── ROOT RENDER ────────────────────────
      return (
        <div className="min-h-screen flex flex-col">
          <header className="border-b border-zinc-800/60 py-3 px-6 flex items-center justify-between">
            <button onClick={() => { setResult(null); setTab("check"); }}
                    className="text-sm font-bold text-white tracking-tight flex items-center gap-2">
              🛡️ Uncle-Factz
            </button>
            <div className="flex gap-1.5">
              <button onClick={() => setTab("check")}
                      className={`px-3 py-1 rounded-lg text-xs font-medium transition ${tab === "check" ? "bg-zinc-800 text-white" : "text-zinc-500 hover:text-zinc-300"}`}>
                Checker
              </button>
              <button onClick={() => setTab("history")}
                      className={`px-3 py-1 rounded-lg text-xs font-medium transition ${tab === "history" ? "bg-zinc-800 text-white" : "text-zinc-500 hover:text-zinc-300"}`}>
                Ledger {history.length > 0 && <span className="ml-1 text-[10px] text-zinc-500">({history.length})</span>}
              </button>
              <button onClick={() => setTab("about")}
                      className={`px-3 py-1 rounded-lg text-xs font-medium transition ${tab === "about" ? "bg-zinc-800 text-white" : "text-zinc-500 hover:text-zinc-300"}`}>
                About
              </button>
            </div>
          </header>

          <main className="flex-1">
            {tab === "about" ? aboutView : tab === "history" ? historyView : (
              <>
                {loading && loadingView}
                {error && <div className="max-w-2xl mx-auto mt-6 p-4 rounded-xl bg-red-950/30 border border-red-500/30 text-red-300 text-sm">{error}</div>}
                {result ? resultsView : (!loading && heroView)}
              </>
            )}
          </main>

          {proofModal}

          <footer className="border-t border-zinc-800/40 py-4 text-center text-[11px] text-zinc-600">
            Uncle-Factz · 4 AI Uncles · Grandpa Reviews · On-Chain Proof
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
